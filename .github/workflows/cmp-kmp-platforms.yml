name: Verify CMP KMP platforms

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

concurrency:
  # Don't waste hosted runners on obsolete commits while iterating on draft PR #22.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-and-desktop:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform required by shared
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          # Forked PRs may restore caches, but cannot write to the repository cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Compile iOS simulator framework
        run: gradle --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace --warning-mode all

      - name: Run isolated SQLCipher tests on iOS Simulator
        run: gradle --no-daemon :shared:iosSimulatorArm64Test --stacktrace --warning-mode all

      # Combine two JVM-focused Gradle invocations; keep iOS framework and SQLCipher
      # tests as separate mandatory checks for actionable failure reporting.
      - name: Compile Desktop and run shared JVM tests on macOS
        run: gradle --no-daemon :desktopApp:compileKotlin :shared:jvmTest --stacktrace --warning-mode all

  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform required by shared
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          # Forked PRs may restore caches, but cannot write to the repository cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # All original targets are retained while one Gradle invocation avoids
      # redundant startup and repeated configuration.
      - name: Compile Windows Desktop and run shared JVM / SQLCipher CRUD tests
        run: gradle --no-daemon :desktopApp:compileKotlin :shared:jvmTest :desktopApp:test --stacktrace --warning-mode all
