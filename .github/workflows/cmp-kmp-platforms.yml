name: Verify CMP KMP platforms

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # If merge queue is enabled, verify the merge-group candidate itself.
  merge_group:
    types: [checks_requested]
  # Repeat FULL cross-platform verification after main merges.
  push:
    branches: [ main ]

concurrency:
  # Don't waste hosted runners on obsolete commits while iterating on draft PR #22.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Classify whether FULL is required
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - name: Checkout exact event commit and PR merge-base history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify classifier and gate decision regressions
        run: python3 -m unittest discover -s ci/tests -p 'test_impact.py' -v && python3 -m unittest discover -s ci/tests -p 'test_full_gate.py' -v
      - name: Select the conservative mode
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo 'mode=FULL' >> "$GITHUB_OUTPUT"
            echo "FULL mandatory for $EVENT_NAME on $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
  ios-and-desktop:
    needs: [impact]
    # Critical/unknown changes still run FULL in a Draft. Classifier failure
    # also falls back to FULL, never to a cheap path.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || needs.impact.result != 'success' || needs.impact.outputs.mode == 'FULL') }}
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA before full tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "FULL tests source SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform required by shared
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          # Forked PRs may restore caches, but cannot write to the repository cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Compile iOS simulator framework
        run: gradle --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace --warning-mode all

      - name: Run isolated SQLCipher tests on iOS Simulator
        run: gradle --no-daemon :shared:iosSimulatorArm64Test --stacktrace --warning-mode all

      # Combine two JVM-focused Gradle invocations; keep iOS framework and SQLCipher
      # tests as separate mandatory checks for actionable failure reporting.
      - name: Compile Desktop and run shared JVM tests on macOS
        run: gradle --no-daemon :desktopApp:compileKotlin :shared:jvmTest --stacktrace --warning-mode all

  windows-desktop:
    needs: [impact]
    # Critical/unknown changes still run FULL in a Draft. Classifier failure
    # also falls back to FULL, never to a cheap path.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || needs.impact.result != 'success' || needs.impact.outputs.mode == 'FULL') }}
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA before full tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "FULL tests source SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform required by shared
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          # Forked PRs may restore caches, but cannot write to the repository cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify JUnit timing summary parser
        run: python -m unittest discover -s ci/tests -p test_windows_test_timings.py

      # All original targets are retained while one Gradle invocation avoids
      # redundant startup and repeated configuration.
      - name: Verify transient quote CMP scenes
        run: gradle --no-daemon :desktopApp:test --tests "com.andreyceilings.desktop.TransientQuoteSceneTest" --stacktrace --warning-mode all

      - name: Compile Windows Desktop and run shared JVM / SQLCipher CRUD tests
        run: gradle --no-daemon :desktopApp:compileKotlin :shared:jvmTest :desktopApp:test --stacktrace --warning-mode all

      # Diagnostic-only summary from existing XML. Never interpret a missing
      # report as a successful test run, and never replace Gradle exit status.
      - name: Summarize Windows JVM and Desktop test timings
        if: always()
        shell: pwsh
        run: python ci/windows_test_timings.py --top 20 --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Preserve Windows Desktop and JVM test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-test-reports
          path: |
            desktopApp/build/test-results/test/
            desktopApp/build/reports/tests/test/
            shared/build/test-results/
            shared/build/reports/tests/
          if-no-files-found: warn
          retention-days: 30

  full-gate:
    # A Draft result has a *different check name* and must NOT satisfy the
    # branch-protected FULL required context when tests were skipped.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CMP advisory' || 'FULL CMP merge gate' }}
    if: ${{ always() }}
    needs: [impact, ios-and-desktop, windows-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate actual jobs, source SHA and gate result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          IMPACT_MODE: ${{ needs.impact.outputs.mode }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB1_RESULT: ${{ needs['ios-and-desktop'].result }}
          JOB2_RESULT: ${{ needs['windows-desktop'].result }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          python3 ci/verify_full_gate.py \
            --event "$EVENT_NAME" \
            --draft "$IS_DRAFT" \
            --impact-result "$IMPACT_RESULT" \
            --mode "$IMPACT_MODE" \
            --job-result "$JOB1_RESULT" \
            --job-result "$JOB2_RESULT" \
            --expected-sha "$EXPECTED_SHA" \
            --actual-sha "$ACTUAL_SHA" \
            --summary "$GITHUB_STEP_SUMMARY"
