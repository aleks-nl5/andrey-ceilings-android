name: Verify CMP KMP platforms

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # If merge queue is enabled, verify the merge-group candidate itself.
  merge_group:
    types: [checks_requested]
  # Main pushes use commit impact; manual dispatch and merge queue force FULL.
  push:
    branches: [ main ]

concurrency:
  # Don't waste hosted runners on obsolete commits while iterating on draft PR #22.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Classify whether FULL is required
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      desktop_depth: ${{ steps.decide.outputs.desktop_depth }}
      windows_smoke_tests: ${{ steps.decide.outputs.windows_smoke_tests }}
      ios_depth: ${{ steps.decide.outputs.ios_depth }}
      apple_depth: ${{ steps.decide.outputs.apple_depth }}
    steps:
      - name: Checkout exact event commit and PR merge-base history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify classifier and gate decision regressions
        run: python3 -m unittest discover -s ci/tests -p 'test_impact.py' -v && python3 -m unittest discover -s ci/tests -p 'test_full_gate.py' -v
      - name: Select the conservative mode
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]]; then
            # On main push compare the actual before/after history so an Android
            # UI merge does not restart Windows deep suites. Missing/zero or
            # unresolvable before SHA triggers classifier FULL fallback.
            if [[ "$EVENT_NAME" == push ]]; then BASE_SHA="$BEFORE_SHA"; fi
            python3 ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo 'mode=FULL' >> "$GITHUB_OUTPUT"
            echo 'desktop_depth=deep' >> "$GITHUB_OUTPUT"
            echo 'ios_depth=deep' >> "$GITHUB_OUTPUT"
            echo 'apple_depth=deep' >> "$GITHUB_OUTPUT"
            echo "Manual/main/merge group: FULL on $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
  ios-and-desktop:
    needs: [impact]
    # Native iOS and macOS JVM DB regressions execute even in Draft when
    # selected depth is deep. Smoke-only Draft uses lightweight feedback.
    if: ${{ always() && (needs.impact.result != 'success' || needs.impact.outputs.ios_depth == 'deep' || needs.impact.outputs.desktop_depth == 'deep' || (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.impact.outputs.apple_depth != 'skip') }}
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA before full tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "FULL tests source SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform required by shared
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          # Forked PRs may restore caches, but cannot write to the repository cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify Xcode toolchain
        if: ${{ needs.impact.outputs.ios_depth != 'skip' || needs.impact.result != 'success' }}
        run: xcodebuild -version

      - name: Compile iOS simulator framework
        if: ${{ needs.impact.outputs.ios_depth != 'skip' || needs.impact.result != 'success' }}
        run: gradle --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace --warning-mode all

      - name: Run isolated SQLCipher tests on iOS Simulator
        if: ${{ needs.impact.outputs.ios_depth == 'deep' || needs.impact.result != 'success' }}
        run: gradle --no-daemon :shared:iosSimulatorArm64Test --stacktrace --warning-mode all

      # Combine two JVM-focused Gradle invocations; keep iOS framework and SQLCipher
      # tests as separate mandatory checks for actionable failure reporting.
      - name: Compile Desktop and run shared JVM tests on macOS
        if: ${{ needs.impact.outputs.desktop_depth == 'deep' || needs.impact.result != 'success' }}
        run: gradle --no-daemon :desktopApp:compileKotlin :shared:jvmTest --stacktrace --warning-mode all
      - name: Compile Desktop host on macOS (scoped UI smoke)
        if: ${{ needs.impact.outputs.desktop_depth == 'smoke' && needs.impact.result == 'success' }}
        run: gradle --no-daemon :desktopApp:compileKotlin :shared:compileKotlinJvm --stacktrace --warning-mode all

  windows-desktop:
    needs: [impact]
    # Native Windows SQLCipher/JDBC deep regression is mandatory even in a
    # Draft Windows DB PR; no cross-platform regression for Android-only UI.
    if: ${{ always() && (needs.impact.result != 'success' || needs.impact.outputs.desktop_depth == 'deep') }}
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA before full tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "FULL tests source SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform required by shared
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          # Forked PRs may restore caches, but cannot write to the repository cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Verify JUnit timing summary parser
        run: python -m unittest discover -s ci/tests -p test_windows_test_timings.py

      # All original targets are retained while one Gradle invocation avoids
      # redundant startup and repeated configuration.
      - name: Verify transient quote CMP scenes
        run: gradle --no-daemon :desktopApp:test --tests "com.andreyceilings.desktop.TransientQuoteSceneTest" --stacktrace --warning-mode all

      - name: Compile Windows Desktop and run shared JVM / SQLCipher CRUD tests
        run: gradle --no-daemon :desktopApp:compileKotlin :shared:jvmTest :desktopApp:test --stacktrace --warning-mode all

      # Real encrypted JDBC stage timings; generated only when the fresh
      # Windows-only diagnostic JUnit test actually executes (never from cache).
      # It reports only times/counts, not credentials, SQL payloads or DB rows.
      - name: Summarize Windows SQLCipher JDBC connection profile
        if: always()
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "windows-sqlcipher-jdbc-profile.md"
          if (Test-Path $profile) {
            Get-Content $profile | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            "## Windows SQLCipher JDBC profile" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            "No fresh sample: profile test was cached, skipped, or failed before reporting." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Preserve Windows SQLCipher JDBC profiling data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-sqlcipher-jdbc-profile
          path: ${{ runner.temp }}/windows-sqlcipher-jdbc-profile.md
          if-no-files-found: warn
          retention-days: 30

      # Diagnostic-only summary from existing XML. Never interpret a missing
      # report as a successful test run, and never replace Gradle exit status.
      - name: Summarize Windows JVM and Desktop test timings
        if: always()
        shell: pwsh
        run: python ci/windows_test_timings.py --top 20 --summary "$env:GITHUB_STEP_SUMMARY"

      - name: Preserve Windows Desktop and JVM test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-test-reports
          path: |
            desktopApp/build/test-results/test/
            desktopApp/build/reports/tests/test/
            shared/build/test-results/
            shared/build/reports/tests/
          if-no-files-found: warn
          retention-days: 30

  windows-desktop-smoke:
    name: Windows Desktop scoped Compose smoke
    needs: [impact]
    if: ${{ needs.impact.result == 'success' && needs.impact.outputs.desktop_depth == 'smoke' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin Windows smoke source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Windows scoped smoke: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Compile Windows/Desktop and exercise production scene smoke
        env:
          WINDOWS_SMOKE_TESTS: ${{ needs.impact.outputs.windows_smoke_tests }}
        run: |
          if (-not $env:WINDOWS_SMOKE_TESTS) { throw 'Windows smoke needs a scene class filter' }
          $filters = foreach ($class in ($env:WINDOWS_SMOKE_TESTS -split ',')) {
            '--tests'
            $class
          }
          gradle --no-daemon :desktopApp:compileKotlin :desktopApp:test @filters --stacktrace --warning-mode all
      - name: Preserve Windows targeted smoke reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-scoped-ui-test-reports
          path: |
            desktopApp/build/test-results/test/
            desktopApp/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 30

  full-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CMP advisory' || 'CMP scoped CI receipt (owner review)' }}
    if: ${{ always() }}
    needs: [impact, ios-and-desktop, windows-desktop, windows-desktop-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove actual scoped Windows and Apple job conclusions on exact SHA
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          IMPACT_MODE: ${{ needs.impact.outputs.mode }}
          DESKTOP_DEPTH: ${{ needs.impact.outputs.desktop_depth }}
          IOS_DEPTH: ${{ needs.impact.outputs.ios_depth }}
          APPLE_DEPTH: ${{ needs.impact.outputs.apple_depth }}
          WINDOWS_FULL_RESULT: ${{ needs['windows-desktop'].result }}
          WINDOWS_SMOKE_RESULT: ${{ needs['windows-desktop-smoke'].result }}
          APPLE_RESULT: ${{ needs['ios-and-desktop'].result }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          windows_result=skipped
          if [[ "$IMPACT_RESULT" != success || "$DESKTOP_DEPTH" == deep ]]; then
            windows_result="$WINDOWS_FULL_RESULT"
          elif [[ "$DESKTOP_DEPTH" == smoke ]]; then
            windows_result="$WINDOWS_SMOKE_RESULT"
          fi
          # A single Apple runner can run macOS JVM and iOS steps independently.
          # Never turn its success into an iOS verification if iOS was skipped.
          ios_result=skipped
          macos_result=skipped
          if [[ "$IOS_DEPTH" != skip ]]; then ios_result="$APPLE_RESULT"; fi
          if [[ "$DESKTOP_DEPTH" != skip ]]; then macos_result="$APPLE_RESULT"; fi
          echo "iOS depth: $IOS_DEPTH; Windows depth: $DESKTOP_DEPTH; macOS/JVM depth: $DESKTOP_DEPTH" >> "$GITHUB_STEP_SUMMARY"
          python3 ci/verify_full_gate.py \
            --event "$EVENT_NAME" --draft "$IS_DRAFT" \
            --impact-result "$IMPACT_RESULT" --mode "$IMPACT_MODE" \
            --expected-group windows --expected-group ios --expected-group macos \
            --coverage "windows:$DESKTOP_DEPTH:$windows_result" \
            --coverage "ios:$IOS_DEPTH:$ios_result" \
            --coverage "macos:$DESKTOP_DEPTH:$macos_result" \
            --expected-sha "$EXPECTED_SHA" --actual-sha "$(git rev-parse HEAD)" \
            --summary "$GITHUB_STEP_SUMMARY"
