# This workflow is loaded exclusively from the default branch, never from
# pull_request source. DO NOT run PR code, Gradle scripts or package scripts here.
# The production keystore is only used to sign an already-built APK from a
# verified same-repo PR. Automatic signing waits for all FAST/TARGETED jobs;
# manual signing allows queued iOS ONLY after Android and Windows passed.
# PR code, Gradle, and PR-provided scripts are NEVER executed with secrets.
name: Sign PR Android release APK

on:
  workflow_run:
    workflows: ["PR fast checks (no FULL)"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to sign (e.g. 157); source branch is found automatically"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-sign-${{ github.event.inputs.pr_number || github.event.issue.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  sign-pr-release:
    name: Sign successful in-repository PR release (trusted)
    # Both manual triggers run the reviewed workflow on main (never PR code).
    # /sign-apk may be requested ONLY by the repository owner on a PR.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == '/sign-apk' && github.actor == github.repository_owner && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact current PR source, FAST jobs, and unsigned artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$TRIGGER" == workflow_dispatch || "$TRIGGER" == workflow_run || "$TRIGGER" == issue_comment ]]

          # Load metadata exclusively from the GitHub REST API, never from PR files.
          quick_workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/draft-impact-feedback.yml" --jq '.id')"
          [[ "$quick_workflow_id" =~ ^[0-9]+$ ]]

          if [[ "$TRIGGER" != workflow_run ]]; then
            # The owner supplies only the PR number (or writes /sign-apk on the
            # PR). This trusted job chooses the newest FAST run for that PR's
            # CURRENT branch and SHA. Never sign a stale/replaced APK.
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Please enter a PR number (e.g. 157)."
              exit 1
            }
            selected_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            jq -e --arg repo "$GITHUB_REPOSITORY" '
              .state == "open" and .base.ref == "main" and
              .head.repo.full_name == $repo and
              (.head.sha | test("^[0-9a-f]{40}$"))
            ' <<<"$selected_pr" >/dev/null || {
              echo "::error::Select an open PR in this repository targeting main."
              exit 1
            }
            expected_sha="$(jq -r '.head.sha' <<<"$selected_pr")"
            source_branch="$(jq -r '.head.ref' <<<"$selected_pr")"

            # GitHub returns runs newest first. A later failed FAST attempt for
            # this SHA must NOT be circumvented by using an older green run.
            candidates="$(gh api -X GET \
              -f branch="$source_branch" -f event=pull_request -f per_page=100 \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$quick_workflow_id/runs")"
            RUN_ID="$(jq -r --arg sha "$expected_sha" --arg repo "$GITHUB_REPOSITORY" --argjson number "$PR_NUMBER" '
              [.workflow_runs[] | select(
                .head_sha == $sha and
                .head_repository.full_name == $repo and
                any(.pull_requests[]?; .number == $number)
              )] | sort_by(.run_number, .run_attempt) |
              if length == 0 then empty else last.id end
            ' <<<"$candidates")"
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
              echo "::error::No FAST run found for the latest commit of PR #$PR_NUMBER. Run FAST checks first."
              exit 1
            }
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]

          source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson workflow "$quick_workflow_id" '
            .event == "pull_request" and
            .workflow_id == $workflow and
            .name == "PR fast checks (no FULL)" and
            .head_repository.full_name == $repo and
            (.pull_requests | length) == 1 and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<<"$source" >/dev/null || {
            echo "::error::Run must belong to the trusted FAST workflow and a same-repository PR."
            exit 1
          }

          source_sha="$(jq -r '.head_sha' <<<"$source")"
          pr_number="$(jq -r '.pull_requests[0].number' <<<"$source")"
          attempt="$(jq -r '.run_attempt' <<<"$source")"
          [[ "$pr_number" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]]
          if [[ "$TRIGGER" != workflow_run && "$PR_NUMBER" != "$pr_number" ]]; then
            echo "::error::The chosen FAST run belongs to a different PR."
            exit 1
          fi
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          jq -e --arg sha "$source_sha" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .base.ref == "main" and
            .head.repo.full_name == $repo and .head.sha == $sha
          ' <<<"$pr" >/dev/null || {
            echo "::error::Source must match the CURRENT head of an open PR from this repository."
            exit 1
          }

          if [[ "$TRIGGER" == workflow_run ]]; then
            # Preserve the original automatic-signing gate.
            jq -e '.conclusion == "success"' <<<"$source" >/dev/null
          else
            # Manual signing skips ONLY unexecuted iOS checks (queued OR
            # runner-starved and cancelled without ever acquiring a runner).
            # Android/Windows failure or a real iOS test failure is NEVER OK.
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
            jq -e --argjson attempt "$attempt" '
              .total_count == (.jobs | length) and
              ([.jobs[] | select(.run_attempt == $attempt and
                .name == "Classify PR risk (quick checks only)" and
                .status == "completed" and .conclusion == "success")] | length) == 1 and
              ([.jobs[] | select(.run_attempt == $attempt and
                .name == "PR Android release candidate and JVM unit tests" and
                .status == "completed" and .conclusion == "success")] | length) == 1 and
              ([.jobs[] | select(.run_attempt == $attempt and
                .name == "PR Windows compile and mapped scene tests" and
                .status == "completed" and .conclusion == "success")] | length) == 1 and
              ([.jobs[] | select(.run_attempt == $attempt and
                .name == "PR iOS framework compilation" and
                ((.conclusion == "success") or (.conclusion == "skipped") or
                 (.conclusion == null and
                  (.status == "queued" or .status == "in_progress" or
                   .status == "waiting" or .status == "pending" or
                   .status == "requested")) or
                 # GitHub can cancel an iOS job after runner starvation. Allow
                 # only when it NEVER ran: no runner allocated, zero steps.
                 (.conclusion == "cancelled" and
                  ((.runner_id // 0) == 0) and
                  ((.runner_name // "") == "") and
                  ((.steps // []) | length) == 0)))] | length) == 1 and
              # Other failures must not be bypassed. The quick-only receipt
              # may fail solely because iOS was cancelled without starting.
              ([.jobs[] | select(.run_attempt == $attempt and
                .conclusion != null and .conclusion != "success" and
                .conclusion != "skipped" and .name != "PR iOS framework compilation" and
                .name != "PR quick-only receipt (NOT full native verification)")] | length) == 0 and
              (([.jobs[] | select(.run_attempt == $attempt and
                .name == "PR quick-only receipt (NOT full native verification)" and
                .conclusion == "failure")] | length) == 0 or
               ([.jobs[] | select(.run_attempt == $attempt and
                .name == "PR iOS framework compilation" and
                .conclusion == "cancelled" and
                ((.runner_id // 0) == 0) and ((.runner_name // "") == "") and
                ((.steps // []) | length) == 0)] | length) == 1)
            ' <<<"$jobs" >/dev/null || {
              echo "::error::Manual signing requires green Android and Windows; iOS may wait or be cancelled without starting, but a real test failure is forbidden."
              exit 1
            }
            echo "Manual APK signing bypasses ONLY an unfinished iOS check. It does NOT approve CI, PR or merge." >> "$GITHUB_STEP_SUMMARY"
          fi

          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          jq -e '.total_count <= 100 and .total_count == (.artifacts | length)' <<<"$artifacts" >/dev/null
          artifact_id="$(jq -r '
            [.artifacts[] | select(.name == "pr-internal-unsigned-release-apk" and
                .expired == false and .size_in_bytes > 0)] |
            if length == 1 then .[0].id else "" end
          ' <<<"$artifacts")"
          if [[ -z "$artifact_id" ]]; then
            if [[ "$TRIGGER" == workflow_dispatch ]]; then
              echo "::error::The latest FAST run for PR #$pr_number has no usable unsigned APK. Check Android CI."
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android APK absent: signing skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "Verified source: PR #$pr_number, FAST $RUN_ID, SHA $source_sha" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download exact unsigned artifact (data only; NEVER execute it)
        if: steps.candidate.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.candidate.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-unsigned-release

      - name: Set up Android SDK tools for independent signature verification
        if: steps.candidate.outputs.available == 'true'
        uses: android-actions/setup-android@v4

      - name: Install trusted APK signing tools
        if: steps.candidate.outputs.available == 'true'
        run: sdkmanager 'build-tools;36.0.0'

      - name: Validate unsigned APK structure, identity and zip alignment
        if: steps.candidate.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/pr-unsigned-release/app-release-unsigned.apk"
          test -s "$apk"
          test "$(find "$RUNNER_TEMP/pr-unsigned-release" -maxdepth 1 -type f | wc -l)" -eq 1
          unzip -tq "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$apk"
          package_line="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '1p')"
          if [[ ! "$package_line" =~ ^package:\ name=\'com\.andreyceilings\.app\'\  ]]; then
            echo "::error::Unexpected release package name"; exit 1
          fi
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::Unsigned PR candidate unexpectedly already contains a valid signature"; exit 1
          fi

      - name: Sign with persistent release key (no PR code execution)
        if: steps.candidate.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Production signing secrets are incomplete; refusing to publish a pseudo-release."
            exit 1
          fi
          keyfile="$RUNNER_TEMP/pr-release-keystore.p12"
          trap 'rm -f "$keyfile"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          mkdir -p "$RUNNER_TEMP/pr-signed-release"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keyfile" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/pr-signed-release/app-release.apk" \
            "$RUNNER_TEMP/pr-unsigned-release/app-release-unsigned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "$RUNNER_TEMP/pr-signed-release/app-release.apk"
          sha256sum "$RUNNER_TEMP/pr-signed-release/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed installable release APK for PR #${{ steps.candidate.outputs.pr_number }}, FAST run ${{ steps.candidate.outputs.run_id }}, source SHA ${{ steps.candidate.outputs.source_sha }}." >> "$GITHUB_STEP_SUMMARY"
          echo "This is a PR smoke artifact, NOT reviewed/merged production and NOT a FULL-test receipt." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK for owner smoke
        if: steps.candidate.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-fast-android-release-apk
          path: ${{ runner.temp }}/pr-signed-release/app-release.apk
          if-no-files-found: error
          retention-days: 14
