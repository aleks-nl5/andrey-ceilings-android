name: Validate KMP iOS framework

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-framework:
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.0'

      - name: Build iOS simulator framework
        run: gradle --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
