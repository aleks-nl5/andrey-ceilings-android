# Fast PR checks for Draft and Ready; full native tests only on main push/manual dispatch.
# Existing file path retained to preserve workflow identity.
name: PR fast checks (no FULL)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Classify PR risk (quick checks only)
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      android: ${{ steps.classify.outputs.android }}
      desktop: ${{ steps.classify.outputs.desktop }}
      ios: ${{ steps.classify.outputs.ios }}
      android_depth: ${{ steps.classify.outputs.android_depth }}
      desktop_depth: ${{ steps.classify.outputs.desktop_depth }}
      ios_depth: ${{ steps.classify.outputs.ios_depth }}
    steps:
      - name: Checkout exact PR head and merge base history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Regression tests for fail-closed classifier
        run: |
          python3 -m unittest discover -s ci/tests -p test_impact.py -v
          python3 -m unittest discover -s ci/tests -p test_full_gate.py -v
          python3 -m unittest discover -s ci/tests -p test_pr_merge_trigger_policy.py -v
          python3 -m unittest discover -s ci/tests -p test_pr_release_artifacts.py -v

      - name: Check new presentation strings against the localization baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m unittest discover -s ci/tests -p test_localization.py -v
          python3 ci/localization.py check --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Classify complete PR diff
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  android-quick:
    name: PR Android release candidate and JVM unit tests
    needs: impact
    if: needs.impact.result == 'success' && needs.impact.outputs.android_depth != 'skip'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert current PR head SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      # Build actual release variant, but NEVER expose production signing secrets
      # to pull_request code or Gradle. A trusted workflow_run signs the output
      # after all selected quick jobs pass, on the default-branch workflow only.
      - name: Build unsigned Android release and run unchanged JVM unit tests
        run: gradle --no-daemon -PquickUnsignedRelease=true :app:assembleRelease :app:testDebugUnitTest :shared:compileKotlinJvm --stacktrace --warning-mode all
      - name: Compile Android instrumentation and shared JVM test sources
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin :shared:compileTestKotlinJvm --stacktrace --warning-mode all
      - name: Run shared geometry and formatting regressions
        run: >-
          gradle --no-daemon :shared:jvmTest
          --tests '*LineCreationSnapTest' --tests '*MeasurementFormattingTest' --tests '*ProjectQuoteMetadataTest'
          --tests '*MeasurementEditModelTest' --tests '*MeasurementNavigationTest'
          --tests '*EstimateNumberingTest' --tests '*EstimateNumberSettingsPersistenceTest'
          --tests '*EstimateV22MigrationTest'
          --tests '*FrozenEstimateConcurrencyTest'
          --tests '*LinePlacementJdbcTest.committedPhysicalV11FixturePreservesHistoryAnchorsAndReceipts'
          --tests '*AreaFeatureJdbcTest.frozenV12PreservesEveryRowAndRejectsHybridBeforeDdl'
          --tests '*AreaFeatureJdbcTest.productionV12MixedHistoryIsPopulatedBeforeGuardedLineRows'
          --tests '*CeilingReceiptJdbcTest.frozenDistributedV13RetainsAllAreaDataAndRejectsHybrid'
          --stacktrace --warning-mode all
      - name: Verify unsigned release candidate for trusted signing
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -tq "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::PR release candidate must be unsigned; no signing key may enter PR jobs."
            exit 1
          fi
          echo "Unsigned RELEASE candidate built from PR head SHA: ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Owner-installable, production-signed release is uploaded by the separate trusted signer after PR quick checks succeed." >> "$GITHUB_STEP_SUMMARY"
      - name: Hand off unsigned release for trusted signing (internal)
        uses: actions/upload-artifact@v7
        with:
          name: pr-internal-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  desktop-quick:
    name: PR Windows compile and integration test compilation
    needs: impact
    if: needs.impact.result == 'success' && needs.impact.outputs.desktop_depth != 'skip'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert current PR head SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Compile Desktop and shared JVM test sources
        run: gradle --no-daemon :desktopApp:compileTestKotlin :shared:compileTestKotlinJvm --stacktrace --warning-mode all
  ios-quick:
    name: PR iOS framework compilation
    needs: impact
    if: needs.impact.result == 'success' && needs.impact.outputs.ios_depth != 'skip'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert current PR head SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Compile iOS framework and Simulator test sources
        run: gradle --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 :shared:compileTestKotlinIosSimulatorArm64 --stacktrace --warning-mode all

  feedback:
    name: PR quick-only receipt (NOT full native verification)
    if: ${{ always() }}
    needs: [impact, android-quick, desktop-quick, ios-quick]
    runs-on: ubuntu-24.04
    env:
      IMPACT_RESULT: ${{ needs.impact.result }}
      MODE: ${{ needs.impact.outputs.mode }}
      ANDROID_DEPTH: ${{ needs.impact.outputs.android_depth }}
      DESKTOP_DEPTH: ${{ needs.impact.outputs.desktop_depth }}
      IOS_DEPTH: ${{ needs.impact.outputs.ios_depth }}
      ANDROID_RESULT: ${{ needs['android-quick'].result }}
      DESKTOP_RESULT: ${{ needs['desktop-quick'].result }}
      IOS_RESULT: ${{ needs['ios-quick'].result }}
    steps:
      - name: Require actual quick results for every selected platform
        shell: bash
        run: |
          set -euo pipefail
          echo "## PR quick verification (NO FULL before merge)" >> "$GITHUB_STEP_SUMMARY"
          echo "Impact classifier: $MODE; risk depth is NOT a claim of executed native tests." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$IMPACT_RESULT" != success ]]; then
            echo "::error::PR impact classifier failed: $IMPACT_RESULT"
            exit 1
          fi
          if [[ "$MODE" != FULL && "$MODE" != TARGETED && "$MODE" != FAST ]]; then
            echo "::error::Unknown impact classification: $MODE"
            exit 1
          fi
          for target in ANDROID DESKTOP IOS; do
            depth_key="${target}_DEPTH"
            depth="${!depth_key}"
            key="${target}_RESULT"
            result="${!key}"
            if [[ "$depth" == skip ]]; then
              echo "- $target: NOT VERIFIED (no applicable source changes)" >> "$GITHUB_STEP_SUMMARY"
              if [[ "$result" != skipped ]]; then
                echo "::error::Unselected $target job unexpectedly ran: $result"
                exit 1
              fi
            elif [[ "$depth" == smoke || "$depth" == deep ]]; then
              echo "- $target: $result (quick compilation and selected unit tests; native FULL not run)" >> "$GITHUB_STEP_SUMMARY"
              if [[ "$result" != success ]]; then
                echo "::error::Required PR quick $target job did not succeed: $result"
                exit 1
              fi
            else
              echo "::error::Invalid platform depth for $target: $depth"
              exit 1
            fi
          done
          echo "FULL native SQLCipher/instrumentation/Windows/iOS regression runs only on main push after merge, or manual workflow_dispatch." >> "$GITHUB_STEP_SUMMARY"
