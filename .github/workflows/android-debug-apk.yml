name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, master, feat/automatic-and-portable-backups, fix/gradle-8-14-6 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      # Configure Go after other toolchain actions so its PATH entry is the active one.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: go-core/go.mod

      - name: Verify Go toolchain
        run: |
          echo "Resolved Go executable: $(command -v go)"
          type -a go
          go version
          test "$(go env GOVERSION)" = "go1.27.3"

      - name: Test Go core
        working-directory: go-core
        run: go test ./...

      - name: Install gomobile
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize gomobile
        run: GOTOOLCHAIN=auto gomobile init

      - name: Build required Go Android library
        env:
          GOTOOLCHAIN: auto
        run: bash scripts/build-android-aar.sh

      - name: Prepare persistent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "No release signing secret configured; release APK will not be built."
          else
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Keystore secret is set, but one or more signing secrets are missing." >&2
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andrey-ceilings-release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/andrey-ceilings-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: andrey-ceilings-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: env.SIGNING_CONFIGURED == 'true'
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Upload release APK
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: andrey-ceilings-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
