name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, master, feat/automatic-and-portable-backups, fix/gradle-8-14-6 ]

concurrency:
  # Don't waste hosted runners on obsolete commits while iterating on draft PR #22.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      # Diagnostic only: do not change compileSdk/targetSdk/minSdk here.
      - name: Probe stable Android SDK API 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=0 | tee "$RUNNER_TEMP/android-sdk-stable-packages.txt"
          platform_package="$(awk -F'|' '/platforms;android-37(\.0)?[[:space:]]*\|/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit }' "$RUNNER_TEMP/android-sdk-stable-packages.txt")"
          if [ -z "$platform_package" ]; then
            echo "::error::Android SDK API 37 platform is not listed in the stable SDK channel (channel 0). Stopping before dependency/build steps."
            exit 1
          fi
          echo "Stable SDK package found: $platform_package"
          sdkmanager --channel=0 "$platform_package"
          platform_suffix="${platform_package#platforms;}"
          test -d "$ANDROID_HOME/platforms/$platform_suffix"
          echo "Confirmed installed stable platform at $ANDROID_HOME/platforms/$platform_suffix"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          # Let trusted branches in this repository save caches; keep fork PRs read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build and test shared KMP calculator and SQLDelight
        run: gradle --no-daemon :shared:assemble :shared:compileKotlinJvm :shared:jvmTest --stacktrace --warning-mode all

      - name: Compile Compose Desktop host
        run: gradle --no-daemon :desktopApp:compileKotlin --stacktrace --warning-mode all

      - name: Audit resolved release runtime dependencies
        run: gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath --console=plain

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace --warning-mode all

      # GitHub's Ubuntu runner exposes /dev/kvm, but the runner user may not have
      # access. Without KVM, the x86_64 emulator takes minutes to boot and its
      # package manager may never become usable (observed in run 40850655184).
      - name: Enable hardware acceleration for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner has no /dev/kvm; cannot run reliable x86_64 Android tests."
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Verify encrypted SQLDelight database on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # android-emulator-runner invokes each script line as a separate
          # shell command. Keep multiline logic inside our own Bash process.
          script: bash ci/run-sqlcipher-instrumentation.sh

      - name: Prepare persistent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "No release signing secret configured; release APK will not be built."
          else
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Keystore secret is set, but one or more signing secrets are missing." >&2
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andrey-ceilings-release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/andrey-ceilings-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: andrey-ceilings-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: env.SIGNING_CONFIGURED == 'true'
        run: gradle --no-daemon assembleRelease --stacktrace --warning-mode all

      - name: Upload release APK
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: andrey-ceilings-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
