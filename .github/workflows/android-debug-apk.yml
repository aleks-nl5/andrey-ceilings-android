name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feat/automatic-and-portable-backups, fix/gradle-8-14-6 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go-core/go.mod

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Test Go core
        working-directory: go-core
        run: go test ./...

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize gomobile
        run: gomobile init

      - name: Build required Go Android library
        run: bash scripts/build-android-aar.sh

      - name: Prepare persistent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "No release signing secret configured; building debug APK."
          else
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Keystore secret is set, but one or more signing secrets are missing." >&2
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andrey-ceilings-release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/andrey-ceilings-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        id: build
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            gradle --no-daemon assembleRelease --stacktrace
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=andrey-ceilings-release-apk" >> "$GITHUB_OUTPUT"
          else
            gradle --no-daemon assembleDebug --stacktrace
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=andrey-ceilings-debug-apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
