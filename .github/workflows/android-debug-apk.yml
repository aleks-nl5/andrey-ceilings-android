name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # If merge queue is enabled, verify the merge-group candidate itself.
  merge_group:
    types: [checks_requested]
  push:
    branches: [ main, master, feat/automatic-and-portable-backups, fix/gradle-8-14-6 ]

concurrency:
  # Don't waste hosted runners on obsolete commits while iterating on draft PR #22.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Classify whether FULL is required
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      android_depth: ${{ steps.decide.outputs.android_depth }}
    steps:
      - name: Checkout exact event commit and PR merge-base history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify classifier and gate decision regressions
        run: python3 -m unittest discover -s ci/tests -p 'test_impact.py' -v && python3 -m unittest discover -s ci/tests -p 'test_full_gate.py' -v
      - name: Select the conservative mode
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 ci/impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo 'mode=FULL' >> "$GITHUB_OUTPUT"
            echo 'android_depth=deep' >> "$GITHUB_OUTPUT"
            echo "Manual/main/merge-group: FULL for $EVENT_NAME on $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    needs: [impact]
    # Run real Android FULL only for Android deep impact or unsafe classifier.
    # Draft TARGETED is handled by the distinct feedback workflow.
    if: ${{ always() && (needs.impact.result != 'success' || (needs.impact.outputs.android_depth == 'deep' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || needs.impact.outputs.mode == 'FULL'))) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA before full tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "FULL tests source SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      # Diagnostic only: do not change compileSdk/targetSdk/minSdk here.
      - name: Probe stable Android SDK API 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=0 | tee "$RUNNER_TEMP/android-sdk-stable-packages.txt"
          platform_package="$(awk -F'|' '/platforms;android-37(\.0)?[[:space:]]*\|/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit }' "$RUNNER_TEMP/android-sdk-stable-packages.txt")"
          if [ -z "$platform_package" ]; then
            echo "::error::Android SDK API 37 platform is not listed in the stable SDK channel (channel 0). Stopping before dependency/build steps."
            exit 1
          fi
          echo "Stable SDK package found: $platform_package"
          sdkmanager --channel=0 "$platform_package"
          platform_suffix="${platform_package#platforms;}"
          test -d "$ANDROID_HOME/platforms/$platform_suffix"
          echo "Confirmed installed stable platform at $ANDROID_HOME/platforms/$platform_suffix"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          # Let trusted branches in this repository save caches; keep fork PRs read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build and test shared KMP calculator and SQLDelight
        run: gradle --no-daemon :shared:assemble :shared:compileKotlinJvm :shared:jvmTest :shared:verifySqlDelightMigration --stacktrace --warning-mode all

      - name: Compile Compose Desktop host
        run: gradle --no-daemon :desktopApp:compileKotlin --stacktrace --warning-mode all

      - name: Audit resolved release runtime dependencies
        run: gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath --console=plain

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace --warning-mode all

      # GitHub's Ubuntu runner exposes /dev/kvm, but the runner user may not have
      # access. Without KVM, the x86_64 emulator takes minutes to boot and its
      # package manager may never become usable (observed in run 40850655184).
      - name: Enable hardware acceleration for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner has no /dev/kvm; cannot run reliable x86_64 Android tests."
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      # Start each suite with a fresh AVD. Restored boot snapshots have
      # intermittently lost the emulator during instrumentation, even when
      # snapshot loading itself succeeds.
      - name: Verify encrypted SQLDelight database on Android emulator
        id: android_instrumentation
        # An initial failure must still fail the job unless the AVD truly
        # disconnects and the entire suite passes in one fresh AVD.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner invokes each script line as a separate
          # shell command. Keep multiline logic inside our own Bash process.
          script: bash ci/run-sqlcipher-instrumentation.sh

      - name: Classify Android emulator transport failure
        id: android_emulator_loss
        if: steps.android_instrumentation.outcome == 'failure'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/p5a-workspace/emulator-disconnected.marker" ]]; then
            echo "lost=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Emulator disconnected during instrumentation; retrying full suite once on a fresh AVD."
          else
            echo "lost=false" >> "$GITHUB_OUTPUT"
            echo "::error::Instrumentation failed without emulator transport loss: no retry for real test failures."
          fi

      # The first run keeps the established SwiftShader renderer. If the AVD
      # disappears, retry the ENTIRE suite on a fresh AVD with the separately
      # supported SwiftShader/ANGLE backend, to isolate renderer instability.
      # This diagnostic fallback never ignores instrumentation failures.
      - name: Retry full instrumentation once on a fresh AVD after emulator loss
        id: android_instrumentation_retry
        if: steps.android_instrumentation.outcome == 'failure' && steps.android_emulator_loss.outputs.lost == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/run-sqlcipher-instrumentation.sh

      - name: Enforce successful Android instrumentation
        if: always()
        shell: bash
        env:
          FIRST_OUTCOME: ${{ steps.android_instrumentation.outcome }}
          EMULATOR_LOST: ${{ steps.android_emulator_loss.outputs.lost }}
          RETRY_OUTCOME: ${{ steps.android_instrumentation_retry.outcome }}
        run: |
          if [[ "$FIRST_OUTCOME" == "success" ]]; then
            echo "Android instrumentation passed on the first AVD."
          elif [[ "$EMULATOR_LOST" == "true" && "$RETRY_OUTCOME" == "success" ]]; then
            echo "::notice::Full instrumentation passed on a fresh AVD after the initial emulator disconnected."
          else
            echo "::error::Android instrumentation did not pass. Real test failures are never ignored."
            exit 1
          fi

      - name: Report Android emulator host diagnostics
        if: always() && (steps.android_instrumentation.outcome == 'failure' || steps.android_instrumentation_retry.outcome == 'failure')
        shell: bash
        run: |
          free -m
          sudo dmesg --ctime | grep -Ei 'out of memory|oom.kill|killed process|qemu.*(segfault|trap)|kvm.*(error|fail)' | tail -40 || true

      - name: Upload P5A Android workspace screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5a-android-workspace
          path: ${{ runner.temp }}/p5a-workspace/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare persistent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "No release signing secret configured; release APK will not be built."
          else
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Keystore secret is set, but one or more signing secrets are missing." >&2
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andrey-ceilings-release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/andrey-ceilings-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: andrey-ceilings-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build release APK
        if: env.SIGNING_CONFIGURED == 'true'
        run: gradle --no-daemon assembleRelease --stacktrace --warning-mode all

      - name: Upload release APK
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: andrey-ceilings-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify production open and recovery in signed release APK
        if: env.SIGNING_CONFIGURED == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/verify-production-release.sh

  build-smoke:
    name: Android focused UI and compile checks
    needs: [impact]
    # No heavy instrumentation suite for Android-only UI changes; this still
    # runs real selected Android touch tests and produces the owner debug APK.
    if: ${{ needs.impact.result == 'success' && needs.impact.outputs.android_depth == 'smoke' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin Android scoped source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Android selected depth: smoke; commit: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Android compile, debug APK and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :shared:compileKotlinJvm --stacktrace --warning-mode all
      - name: Check emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run focused Android UI touch regression (not whole encrypted DB suite)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            gradle --no-daemon :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.andreyceilings.app.MeasurementWorkspaceLayoutTest,com.andreyceilings.app.OverlayDragTouchTest,com.andreyceilings.app.AreaFeatureTouchTest
            --stacktrace --warning-mode all
      - name: Keep Android scoped debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-scoped-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
      - name: Keep focused UI XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-scoped-ui-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30

  full-gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft Android advisory' || 'Android scoped CI receipt (owner review)' }}
    if: ${{ always() }}
    needs: [impact, build, build-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove selected Android depth, job result and exact event SHA
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          IMPACT_MODE: ${{ needs.impact.outputs.mode }}
          ANDROID_DEPTH: ${{ needs.impact.outputs.android_depth }}
          FULL_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs['build-smoke'].result }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          job_result=skipped
          if [[ "$IMPACT_RESULT" != success || "$ANDROID_DEPTH" == deep ]]; then
            job_result="$FULL_RESULT"
          elif [[ "$ANDROID_DEPTH" == smoke ]]; then
            job_result="$SMOKE_RESULT"
          fi
          python3 ci/verify_full_gate.py \
            --event "$EVENT_NAME" --draft "$IS_DRAFT" \
            --impact-result "$IMPACT_RESULT" --mode "$IMPACT_MODE" \
            --expected-group android --coverage "android:$ANDROID_DEPTH:$job_result" \
            --expected-sha "$EXPECTED_SHA" --actual-sha "$actual" \
            --summary "$GITHUB_STEP_SUMMARY"
